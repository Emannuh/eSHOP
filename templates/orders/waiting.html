{% extends "base.html" %}

{% block title %}Waiting for Payment — Duka{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-12 text-center">
  <h1 class="text-2xl font-bold text-gray-800 mb-2">Complete Your Payment</h1>
  <p class="text-gray-500 mb-8">
    Order <strong>{{ order.reference }}</strong> — KES {{ order.total|floatformat:"0" }}
  </p>

  <!-- HTMX polling container -->
  <div
    id="status-container"
    hx-get="{% url 'orders:status' order.pk %}"
    hx-trigger="load, every 3s"
    hx-swap="innerHTML"
  >
    <div class="text-center py-8">
      <div class="text-6xl mb-4 animate-pulse">📲</div>
      <h2 class="text-xl font-semibold text-gray-700 mb-2">Waiting for payment…</h2>
      <p class="text-gray-500 text-sm">Check your phone for the M-Pesa prompt and enter your PIN.</p>
    </div>
  </div>
</div>
{% endblock %}
