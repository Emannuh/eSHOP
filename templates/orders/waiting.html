{% extends "base.html" %}

{% block title %}Waiting for Payment — Duka{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-10">
  <div class="bg-white rounded-3xl shadow-card p-8 sm:p-10 text-center">
    <!-- Order reference pill -->
    <div class="inline-flex items-center gap-2 bg-slate-100 text-slate-600 text-xs font-semibold px-3 py-1.5 rounded-full mb-8">
      Order
      <span class="font-mono bg-white px-2 py-0.5 rounded-md border border-slate-200 text-slate-800">{{ order.reference }}</span>
    </div>

    <!-- HTMX polling container -->
    <div
      id="status-container"
      hx-get="{% url 'orders:status' order.pk %}"
      hx-trigger="load, every 3s"
      hx-swap="innerHTML"
    >
      <!-- Initial skeleton — replaced by HTMX immediately -->
      <div class="py-4">
        <div class="w-20 h-20 bg-brand-50 rounded-full flex items-center justify-center mx-auto mb-6 animate-pulse-slow">
          <svg class="w-10 h-10 text-brand-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"/>
          </svg>
        </div>
        <h2 class="text-xl font-bold text-slate-800 mb-2">Check Your Phone</h2>
        <p class="text-slate-500 text-sm leading-relaxed">An M-Pesa prompt has been sent to your phone.<br/>Enter your PIN to complete payment.</p>
      </div>
    </div>

    <!-- Amount -->
    <div class="mt-8 pt-6 border-t border-slate-100">
      <p class="text-xs text-slate-400 mb-1">Amount due</p>
      <p class="text-3xl font-extrabold text-brand-700">KES {{ order.total|floatformat:"0" }}</p>
    </div>
  </div>
</div>
{% endblock %}
