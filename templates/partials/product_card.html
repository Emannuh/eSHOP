<article class="bg-white rounded-2xl shadow-card hover:shadow-card-hover transition-all duration-300 overflow-hidden flex flex-col group">
  <!-- Image -->
  <a href="{{ product.get_absolute_url }}" class="block relative overflow-hidden bg-slate-100" style="aspect-ratio:1">
    {% if product.primary_image %}
      <img
        src="{{ product.primary_image.image.url }}"
        alt="{{ product.primary_image.alt_text|default:product.name }}"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out"
        loading="lazy"
      />
    {% else %}
      <div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200">
        <svg class="w-12 h-12 text-slate-300" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/>
        </svg>
      </div>
    {% endif %}

    <!-- Out of stock overlay -->
    {% if not product.in_stock %}
      <div class="absolute inset-0 bg-white/60 flex items-center justify-center">
        <span class="bg-slate-800/80 text-white text-xs font-semibold px-3 py-1 rounded-full backdrop-blur-sm">Out of Stock</span>
      </div>
    {% endif %}
  </a>

  <!-- Info -->
  <div class="p-4 flex flex-col flex-1">
    <p class="text-[11px] text-slate-400 font-medium uppercase tracking-widest mb-1">{{ product.category.name }}</p>
    <a href="{{ product.get_absolute_url }}"
       class="text-sm font-semibold text-slate-800 hover:text-brand-700 transition leading-snug line-clamp-2 mb-3 flex-1">
      {{ product.name }}
    </a>

    <div class="flex items-center justify-between gap-2 mt-auto pt-3 border-t border-slate-100">
      <span class="text-brand-700 font-bold text-sm">{{ product.price_display }}</span>
      {% if product.in_stock %}
        <form
          hx-post="{% url 'cart:add' product.pk %}"
          hx-target="#cart-icon"
          hx-swap="innerHTML"
          class="inline"
        >
          {% csrf_token %}
          <input type="hidden" name="quantity" value="1" />
          <button
            type="submit"
            class="flex items-center gap-1.5 bg-brand-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-brand-800 active:scale-95 transition-all duration-150"
            aria-label="Add {{ product.name }} to cart"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
            </svg>
            Add
          </button>
        </form>
      {% endif %}
    </div>
  </div>
</article>
