<a href="{% url 'cart:detail' %}"
   class="relative flex items-center gap-2 text-slate-700 hover:text-brand-700 transition group"
   aria-label="Cart, {{ cart|length }} item{{ cart|length|pluralize }}">
  <span class="relative">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
    </svg>
    {% if cart %}
      <span class="absolute -top-1.5 -right-1.5 bg-brand-600 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center leading-none">
        {{ cart|length }}
      </span>
    {% endif %}
  </span>
  <span class="hidden sm:block text-sm font-medium">Cart</span>
</a>
